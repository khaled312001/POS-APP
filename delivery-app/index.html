<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F6F5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#040E32" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Order online" />
  <title>Order online</title>

  <!-- Config injected by the server (server/index.ts). -->
  <script>window.DELIVERY_CONFIG = __DELIVERY_CONFIG__;</script>
  <script>
    // Stamp the saved theme before first paint ("kassenta_theme" is shared with
    // the customer app and the POS; "system" or nothing follows the OS).
    (function () {
      try {
        var t = localStorage.getItem("kassenta_theme") || localStorage.getItem("barmagly_theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    /* Critical: no flash before the stylesheets arrive on a slow link. */
    html, body { margin: 0; background: #F2F6F5; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #040E32; }
    @media (prefers-color-scheme: dark) { html:not([data-theme]), html:not([data-theme]) body { background: #040E32; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    #splash .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(127,150,148,.3); border-top-color: #0A6E65; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
  <link rel="stylesheet" href="/api/delivery-app/css/base.css?v=20260925a" />
  <link rel="stylesheet" href="/api/delivery-app/css/app.css?v=20260925a" />
</head>
<body>
  <div id="splash" role="status" aria-live="polite"><div class="spin"></div></div>

  <div id="shell" hidden>
    <header class="app-header" id="app-header"></header>
    <div class="net-banner" id="net-banner" hidden></div>
    <main id="app" tabindex="-1"></main>
    <div id="cart-bar" hidden></div>
    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script src="/api/delivery-app/js/core.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/vendor/icons.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/auth.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/api.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/router.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/cart.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/ui.js?v=20260925a"></script>
  <!-- Local helper only; Stripe.js itself is loaded on demand, and never for currencies Stripe can't take. -->
  <script src="/api/delivery-app/js/stripe-payments.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/home.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/menu.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/cart-page.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/checkout.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/tracking.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/account.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/login.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/offers.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/rewards.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/search.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/favorites.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/help.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/reviews.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/stamps.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/giftcards.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/courier.js?v=20260925a"></script>
  <script src="/api/delivery-app/js/pages/partner.js?v=20260925a"></script>

  <script>
  (function () {
    "use strict";
    var cfg = window.DELIVERY_CONFIG || {};
    var slug = cfg.slug || "";
    var html = document.documentElement;
    var $ = function (id) { return document.getElementById(id); };

    // ── Theme ─────────────────────────────────────────────────────────────
    window.setTheme = function (t) {
      safeStorage.set("kassenta_theme", t);
      if (t === "dark" || t === "light") html.setAttribute("data-theme", t);
      else html.removeAttribute("data-theme");
    };

    // ── Brand colour ──────────────────────────────────────────────────────
    // #FF5722 / #2FD3C6 are the retired defaults the server still sends for a
    // store that never picked a colour. White text sits on the primary colour,
    // so a very light brand colour is darkened until it stays readable.
    function hexToRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
    function rgbToHex(r) { return "#" + r.map(function (v) { return ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join(""); }
    function shade(h, f) { return rgbToHex(hexToRgb(h).map(function (v) { return v * (1 + f); })); }
    function lum(h) {
      return hexToRgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); })
        .reduce(function (a, v, i) { return a + v * [0.2126, 0.7152, 0.0722][i]; }, 0);
    }
    function applyBrand(sc) {
      var retired = { "#ff5722": 1, "#2fd3c6": 1 };
      var p = String(cfg.primaryColor || sc.primaryColor || "").toLowerCase();
      if (!/^#[0-9a-f]{6}$/.test(p) || retired[p]) return;
      for (var i = 0; i < 8 && lum(p) > 0.3; i++) p = shade(p, -0.15); // ≥ ~4.5:1 with white
      html.style.setProperty("--delivery-primary", p);
      html.style.setProperty("--delivery-primary-dark", shade(p, -0.18));
      var rgb = hexToRgb(p);
      html.style.setProperty("--delivery-primary-light", "rgba(" + rgb.join(",") + ",0.12)");
      html.style.setProperty("--accent-soft", "color-mix(in srgb, " + p + " 12%, var(--surface))");
      html.style.setProperty("--accent-ring", "rgba(" + rgb.join(",") + ",0.22)");
    }

    // ── Shell (built after the language is known) ─────────────────────────
    function buildShell(sc) {
      var name = sc.storeName || cfg.storeName || "";
      var logo = fixImageUrl(sc.logo || cfg.logo || "");
      var other = kx.lang() === "ar" ? "EN" : "ع";
      $("app-header").innerHTML =
        '<a class="app-header__brand" href="' + esc(router.url("home")) + '" data-nav="home">' +
          (logo ? '<img src="' + esc(logo) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<span class="ph">' + icon("store", "icon-md") + "</span>") +
          "<span>" + esc(name) + "</span></a>" +
        '<nav class="app-header__nav" aria-label="' + esc(L("Main", "الرئيسية")) + '">' +
          '<a href="' + esc(router.url("menu")) + '" data-nav="menu" data-tab="menu">' + esc(L("Menu", "القائمة")) + "</a>" +
          (sc.enablePromos !== false ? '<a href="' + esc(router.url("offers")) + '" data-nav="offers" data-tab="offers">' + esc(L("Offers", "العروض")) + "</a>" : "") +
          '<a href="' + esc(router.url("history")) + '" data-nav="history" data-tab="orders">' + esc(L("My orders", "طلباتي")) + "</a>" +
        "</nav>" +
        '<div class="app-header__actions">' +
          '<button class="lang-btn" id="lang-toggle" lang="' + (kx.lang() === "ar" ? "en" : "ar") + '" aria-label="' + esc(L("العربية", "English")) + '">' + other + "</button>" +
          '<button class="icon-btn hdr-desktop" data-nav="account" aria-label="' + esc(L("Account", "حسابي")) + '">' + icon("user-round", "icon-md") + "</button>" +
          '<button class="icon-btn hdr-cart" data-nav="cart" aria-label="' + esc(L("Cart", "السلة")) + '"><span class="nav-ico">' + icon("shopping-bag", "icon-md") + '<span class="nav-badge" data-cart-count hidden></span></span></button>' +
        "</div>";
      $("lang-toggle").onclick = function () { kx.setLang(kx.lang() === "ar" ? "en" : "ar"); };

      var tabs = [
        ["home", "home", "house", L("Home", "الرئيسية")],
        ["menu", "menu", "utensils", L("Menu", "القائمة")],
        ["cart", "cart", "shopping-bag", L("Cart", "السلة")],
        ["orders", "history", "receipt", L("Orders", "طلباتي")],
        ["account", "account", "user-round", L("Account", "حسابي")],
      ];
      $("bottom-nav").setAttribute("aria-label", L("Main", "الرئيسية"));
      $("bottom-nav").innerHTML = tabs.map(function (t) {
        return '<a class="bottom-nav__item" href="' + esc(router.url(t[1])) + '" data-nav="' + t[1] + '" data-tab="' + t[0] + '">' +
          '<span class="nav-ico">' + icon(t[2], "icon-md") + (t[0] === "cart" ? '<span class="nav-badge" data-cart-count hidden></span>' : "") + "</span>" +
          "<span>" + esc(t[3]) + "</span></a>";
      }).join("");

      document.title = name ? name + " — " + L("Order online", "اطلب أونلاين") : L("Order online", "اطلب أونلاين");
      $("net-banner").innerHTML = icon("wifi-off", "icon-sm") + " " + esc(L("You're offline — check your connection", "أنت غير متصل — تحقّق من الإنترنت"));
    }

    var TAB_OF = { home: "home", menu: "menu", search: "menu", cart: "cart", checkout: "cart", history: "orders",
      account: "account", addresses: "account", favorites: "account", rewards: "account", help: "account", login: "account", offers: "offers" };
    function onRoute(name) {
      var tab = TAB_OF[name] || "";
      document.querySelectorAll("[data-tab]").forEach(function (el) {
        var on = el.getAttribute("data-tab") === tab;
        el.classList.toggle("is-on", on);
        if (on) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
      });
      ui.updateCartBar();
    }
    function updateBadges(st) {
      document.querySelectorAll("[data-cart-count]").forEach(function (b) {
        b.textContent = st.count > 99 ? "99+" : String(st.count);
        b.hidden = !st.count;
      });
      ui.updateCartBar();
    }

    // ── Dine-in: ?table=<token> from a table QR code ──────────────────────
    function handleTable() {
      var qs = new URLSearchParams(location.search);
      var token = qs.get("table");
      if (!token) return;
      qs.delete("table");
      history.replaceState(history.state, "", location.pathname + (qs.toString() ? "?" + qs : ""));
      http("/api/dine-in/validate/" + encodeURIComponent(token), { timeout: 10000, auth: false }).then(function (r) {
        if (r && r.valid) {
          cart.setDineIn(token, r.tableName || null);
          showToast(L("Ordering for table ", "الطلب للطاولة ") + (r.tableName || ""), "success", 4000);
          if (document.body.getAttribute("data-page") === "home") router.replace("home");
        } else showToast(L("This table code is not valid any more. Please ask the staff.", "رمز الطاولة لم يعد صالحاً. يرجى سؤال الموظفين."), "error", 6000);
      }).catch(function () {});
    }

    function routes() {
      var p = "/order/" + slug;
      return [
        { name: "home", path: p, render: pages.home.render },
        { name: "menu", path: p + "/menu", render: pages.menu.render },
        { name: "cart", path: p + "/cart", render: pages.cart.render },
        { name: "checkout", path: p + "/checkout", render: pages.checkout.render },
        { name: "tracking", path: p + "/track/:token", render: pages.tracking.render },
        { name: "account", path: p + "/account", render: pages.account.render },
        { name: "history", path: p + "/orders", render: pages.account.renderHistory },
        { name: "addresses", path: p + "/addresses", render: pages.account.renderAddresses },
        { name: "login", path: p + "/login", render: pages.login.render },
        { name: "offers", path: p + "/offers", render: pages.offers.render },
        { name: "rewards", path: p + "/rewards", render: pages.rewards.render },
        { name: "search", path: p + "/search", render: pages.search.render },
        { name: "favorites", path: p + "/favorites", render: pages.favorites.render },
        { name: "help", path: p + "/help", render: pages.help.render },
        { name: "reviews", path: p + "/reviews", render: pages.reviews.render },
        { name: "stamps", path: p + "/stamps", render: pages.stamps.render },
        { name: "giftcards", path: p + "/giftcards", render: pages.giftcards.render },
        { name: "courier", path: p + "/courier", render: pages.courier.render },
        { name: "partner", path: p + "/partner", render: pages.partner.render },
      ];
    }

    // ── Offline banner ────────────────────────────────────────────────────
    function net() { var b = $("net-banner"); if (b) b.hidden = navigator.onLine !== false; }
    window.addEventListener("online", function () { net(); showToast(L("Back online", "عاد الاتصال"), "success"); });
    window.addEventListener("offline", net);

    window.addEventListener("unhandledrejection", function (e) { console.error("[unhandled]", e.reason); e.preventDefault(); });

    // ── Boot ──────────────────────────────────────────────────────────────
    // Language and currency come from the store API (the injected config can
    // carry the tenant's default currency), so the shell waits for it — with a
    // timeout and a retry screen instead of an endless spinner.
    var started = false;
    router.init(slug, cfg.basePath || "");
    router.define(routes());
    function boot() {
      var splash = $("splash");
      splash.innerHTML = '<div class="spin"></div>';
      shop.config().then(function (sc) {
        kx.applyLang();
        applyBrand(sc);
        buildShell(sc);
        cart.init(cfg.tenantId);
        if (!started) {
          started = true;
          cart.onChange(updateBadges);
          router.onRoute(onRoute);
          auth.onChange(function () { ui.updateCartBar(); });
        }
        updateBadges(cart.getState());
        $("shell").hidden = false;
        router._resolve();
        splash.remove();
        net();
        refreshIcons();
        handleTable();
        shop.menu().catch(function () {});            // warm the menu for every page
        if (auth.isLoggedIn()) auth.loadMe();         // refresh a cached profile quietly
      }, function (err) {
        kx.applyLang();
        splash.innerHTML =
          '<div class="boot-error" style="display:grid;gap:12px;justify-items:center;text-align:center;padding:0 24px;max-width:360px;color:inherit">' +
            '<strong style="font-size:1.15rem">' + esc(err && err.status === 404 ? L("Store not found", "المتجر غير موجود") : L("We couldn't load the store", "تعذّر تحميل المتجر")) + "</strong>" +
            '<span style="opacity:.8">' + esc(err && err.message || "") + "</span>" +
            (err && err.status === 404 ? "" : '<button class="btn btn-primary" id="boot-retry">' + esc(L("Try again", "أعد المحاولة")) + "</button>") +
          "</div>";
        var b = $("boot-retry");
        if (b) b.onclick = boot;
      });
    }
    boot();

    // No offline cache is used for this page; keep the existing worker registered for push.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/api/delivery-app/sw.js", { scope: "/api/delivery-app/" }).catch(function () {});
    }
  })();
  </script>
</body>
</html>
