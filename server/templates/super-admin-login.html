<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassenta Super Admin | Login</title>
    <link rel="icon" href="/brand/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kassenta_theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
      function toggleTheme() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('kassenta_theme', next); } catch (e) {}
      }
    </script>
    <style>
        /* Light is the default; the toggle in the corner stores the choice in
           localStorage under the same key the POS app uses, so a user who picks
           dark once gets it everywhere. */
        :root {
            color-scheme: light;
            --bg-dark: #F4F6FA;
            --bg-card: #FFFFFF;
            --primary: #0C8F85;
            --primary-hover: #0A7A71;
            --primary-ink: #FFFFFF;
            --text-main: #0B1220;
            --text-muted: #667085;
            --danger: #DC2626;
            --border: #DCE3ED;
            --input-bg: #FFFFFF;
            --input-bg-focus: #FFFFFF;
            --input-border: #CBD5E1;
            --glow-1: rgba(12, 143, 133, 0.10);
            --glow-2: rgba(30, 64, 175, 0.08);
            --card-shadow: 0 18px 48px rgba(11, 18, 32, .10);
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg-dark: #0A0E17;
            --bg-card: rgba(18, 24, 38, 0.72);
            --primary: #00C1B0;
            --primary-hover: #26b1a6;
            --primary-ink: #04121F;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --danger: #ef4444;
            --border: rgba(0, 193, 176, 0.18);
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-bg-focus: rgba(0, 0, 0, 0.4);
            --input-border: rgba(255, 255, 255, 0.1);
            --glow-1: rgba(0, 193, 176, 0.15);
            --glow-2: rgba(99, 102, 241, 0.12);
            --card-shadow: 0 24px 60px rgba(0, 0, 0, .55);
        }

        .theme-toggle {
            position: fixed;
            top: 18px;
            inset-inline-end: 18px;
            z-index: 10;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            transition: color .18s, border-color .18s;
        }
        .theme-toggle:hover { color: var(--primary); border-color: var(--primary); }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .i-moon { display: none; }
        [data-theme="dark"] .theme-toggle .i-sun { display: none; }
        [data-theme="dark"] .theme-toggle .i-moon { display: block; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        html, body { overflow-x: clip; max-width: 100%; }
        @supports not (overflow-x: clip) { html, body { overflow-x: hidden; } }
        img, svg { max-width: 100%; height: auto; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 16px;
            overflow: hidden;
        }

        /* Abstract Background Elements — sized so they never push the
           document width past the viewport on small screens. */
        .bg-glow {
            position: absolute;
            width: min(600px, 90vw);
            height: min(600px, 90vw);
            background: radial-gradient(circle, var(--glow-1) 0%, transparent 70%);
            top: clamp(-300px, -25vw, -100px);
            left: clamp(-300px, -20vw, -50px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: min(800px, 95vw);
            height: min(800px, 95vw);
            background: radial-gradient(circle, var(--glow-2) 0%, transparent 70%);
            bottom: clamp(-300px, -25vw, -120px);
            right: clamp(-300px, -20vw, -50px);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            z-index: 10;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        /* We'll use a pure CSS logo instead of loading an image to ensure it always renders */
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 20%, transparent), color-mix(in srgb, var(--primary) 6%, transparent));
            border: 1px solid var(--primary);
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 0 20px color-mix(in srgb, var(--primary) 22%, transparent);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            color: var(--primary);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 10px;
            background: color-mix(in srgb, var(--primary) 10%, transparent);
            color: var(--primary);
            border: 1px solid color-mix(in srgb, var(--primary) 32%, transparent);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: var(--input-bg-focus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
        }

        .input-wrapper input:focus+svg {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--primary-ink);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 32%, transparent);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-message {
            background: color-mix(in srgb, var(--danger) 10%, transparent);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid color-mix(in srgb, var(--danger) 28%, transparent);
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message svg {
            width: 16px;
            height: 16px;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid color-mix(in srgb, var(--primary-ink) 30%, transparent);
            border-top-color: var(--primary-ink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .btn-content {
            transition: opacity 0.2s;
        }

        .loading .btn-content {
            opacity: 0;
        }

        .loading .loader {
            display: block;
        }
    </style>
</head>

<body>
    <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle colour theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0">
      <div class="bg-glow"></div>
      <div class="bg-glow-2"></div>
    </div>

    <div class="login-container">
        <div class="logo-area">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
            </div>
            <div class="logo-text">Kassenta POS</div>
            <div class="logo-badge">Super Admin Console</div>
        </div>

        <div id="errorBox" class="error-message">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="errorText">Invalid username or password</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" required placeholder="info@kassenta.com"
                        autocomplete="email">
                    <!-- Icon must come AFTER input for sibling selector styling -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required placeholder="••••••••"
                        autocomplete="current-password">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-content">Authenticate</span>
                <div class="loader"></div>
            </button>
        </form>
    </div>

    <script>
        // Check if already logged in — but VALIDATE the token before redirecting.
        // A stale token (e.g. after a server JWT-secret rotation) used to cause a
        // dashboard→login bounce loop: the login page redirected blindly, the
        // dashboard's first API call 401'd, and it bounced back here. Now we
        // verify the token and clear it if invalid, showing the login form.
        (async function () {
            const token = localStorage.getItem('super_admin_token');
            if (!token) return;
            const base = location.pathname.startsWith('/api/') ? '/api' : '';
            try {
                const res = await fetch('/api/super-admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + token },
                    cache: 'no-store'
                });
                if (res.ok) {
                    window.location.href = base + '/super-admin/dashboard';
                } else {
                    localStorage.removeItem('super_admin_token');
                    localStorage.removeItem('super_admin_user');
                }
            } catch (e) {
                localStorage.removeItem('super_admin_token');
                localStorage.removeItem('super_admin_user');
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');

            errorBox.style.display = 'none';
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const response = await fetch('/api/super-admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }

                // Success! Save token and redirect
                localStorage.setItem('super_admin_token', data.token);
                localStorage.setItem('super_admin_user', JSON.stringify(data.admin || data.user));

                // Keep button in loading state while redirecting
                // Use /api/ prefix for Hostinger CDN compatibility
                const base = location.pathname.startsWith('/api/') ? '/api' : '';
                window.location.href = base + '/super-admin/dashboard';
            } catch (err) {
                document.getElementById('errorText').innerText = err.message;
                errorBox.style.display = 'flex';
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
